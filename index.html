<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tesla Roadster Stunt</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%;margin:0;background:#0b0f1a}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
// 1 world unit = 1 metre. Car ~4.2 m long, ramp radius 12 m (24 m tall), 45 m row of Teslas + 16 m semi.
const PI=Math.PI,G=9.81,R=12,RX=330,r0=.55,PHI=2.88,RR=R-r0,OX=140;
const wrap=a=>((a+PI)%(2*PI)+2*PI)%(2*PI)-PI,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const OB=[{x:OX,w:44,h:1.5},{x:OX+46,w:16,h:4.1}];
const K={};let S,cx=0,cy=9;
function reset(){S={x:5,y:r0,vx:0,vy:0,a:0,mode:'ground',v:0,phi:0,s:0,fuel:100,state:'lights',t:0,lit:0,tGo:0,react:null,jump:false,flips:0,acc:0,air:0,airNow:0,jumps:0,best:0,maxV:0,sp:0,time:0,end:0,thr:false,why:'',ramp:false};cx=S.x;cy=9}
reset();
addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();if(!K[e.code])press(e.code);K[e.code]=1});
addEventListener('keyup',e=>K[e.code]=0);
function press(c){const go=c=='Space'||c=='ArrowUp';
if(S.state=='lights'&&go)S.jump=true;
else if(S.state=='race'&&go&&S.react===null)S.react=(performance.now()-S.tGo)/1000;
else if((S.state=='done'||S.state=='crash')&&performance.now()-S.end>700&&(go||c=='KeyR'||c=='Enter'))reset()}
function crash(w){S.state='crash';S.why=w;S.end=performance.now();S.thr=false}
function step(dt){
if(S.state=='lights'){S.t+=dt;S.lit=Math.min(5,Math.floor(S.t/.8));if(S.lit>=5){S.state='race';S.tGo=performance.now()}return}
if(S.state!='race')return;
S.time+=dt;const th=K.Space&&S.fuel>0,up=K.ArrowUp,rot=(K.ArrowLeft?1:0)-(K.ArrowRight?1:0);S.thr=false;
const burn=()=>{S.fuel=Math.max(0,S.fuel-10*dt);S.thr=true};
if(S.mode=='ground'){let v=S.v;if(up)v+=9*dt;if(K.ArrowDown)v-=22*dt;v=cl(v-v*.05*dt,-70,70);
if(th){S.mode='air';S.vx=v;S.vy=3;S.a=.5;S.acc=0;S.airNow=0;S.y=r0+.02}
else{S.v=v;S.x+=v*dt;S.y=r0;S.a+=wrap(-S.a)*Math.min(1,10*dt);if(S.x>=RX&&v>0){S.mode='ramp';S.phi=0;S.s=v}}}
if(S.mode=='ramp'){let s=S.s;if(up)s+=6*dt;if(th)(s+=28*dt,burn());
s-=G*Math.sin(S.phi)*dt;S.phi+=s/RR*dt;S.s=s;S.a=S.phi;S.x=RX+RR*Math.sin(S.phi);S.y=R-RR*Math.cos(S.phi);
if(S.phi<=0){if(s<0){S.mode='ground';S.v=s;S.x=RX;S.y=r0;S.a=0}else S.phi=0}
else if(S.phi>=PHI){S.mode='air';S.vx=s*Math.cos(S.phi);S.vy=s*Math.sin(S.phi);S.acc=0;S.airNow=0;S.ramp=true}}
if(S.mode=='air'){S.vy-=G*dt;S.a=wrap(S.a+rot*3.4*dt);S.acc+=rot*3.4*dt;
while(Math.abs(S.acc)>=2*PI){S.flips++;S.acc-=Math.sign(S.acc)*2*PI}
S.airNow+=dt;S.air+=dt;S.best=Math.max(S.best,S.airNow);
if(th){burn();S.vx+=Math.cos(S.a)*28*dt;S.vy+=Math.sin(S.a)*28*dt}
const sp=Math.hypot(S.vx,S.vy);if(sp>90){S.vx*=90/sp;S.vy*=90/sp}
S.x+=S.vx*dt;S.y+=S.vy*dt;
for(const o of OB)if(S.x>o.x-2&&S.x<o.x+o.w+2&&S.y-r0<o.h-.05)return crash('Hit the '+(o.h>2?'semi truck!':'Teslas!'));
if(S.y<=r0&&S.vy<0){if(Math.abs(wrap(S.a))>.9)return crash('Bad landing!');
S.mode='ground';S.y=r0;S.v=S.vx;if(S.airNow>.4)S.jumps++;if(S.ramp){S.state='done';S.end=performance.now()}}}
S.sp=S.mode=='ground'?Math.abs(S.v):S.mode=='ramp'?Math.abs(S.s):Math.hypot(S.vx,S.vy);S.maxV=Math.max(S.maxV,S.sp)}
function rr(x,y,w,hh,r){g.beginPath();g.roundRect(x,y,w,hh,r)}
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,2*PI);g.fill()}
function draw(){
const Z=Math.min(H/42,W/60);cx+=(S.x-cx)*.1;cy+=(Math.max(9,S.y)-cy)*.08;
g.setTransform(1,0,0,1,0,0);let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#05070f');gr.addColorStop(1,'#2b4a7a');g.fillStyle=gr;g.fillRect(0,0,W,H);
g.fillStyle='#fff';for(let i=0;i<70;i++){g.globalAlpha=.3+(i%4)*.18;g.fillRect((i*137.5)%W,(i*71.3)%(H*.6),2,2)}g.globalAlpha=1;
const gx=cx-W/Z/2-5,gw=W/Z+10;
g.setTransform(Z,0,0,-Z,W/2-cx*Z,H/2+cy*Z);
g.fillStyle='#3b2f25';g.fillRect(gx,-60,gw,58.5);g.fillStyle='#2b2d33';g.fillRect(gx,-1.5,gw,1.5);
g.strokeStyle='#f5d44b';g.lineWidth=.12;g.setLineDash([2,2]);g.beginPath();g.moveTo(gx,-.75);g.lineTo(gx+gw,-.75);g.stroke();g.setLineDash([]);
g.strokeStyle='#8a94a6';g.lineWidth=1.2;g.beginPath();g.arc(RX,R,R+.6,-PI/2,-PI/2+PHI);g.stroke();
g.strokeStyle='#e8edf5';g.lineWidth=.15;g.beginPath();g.arc(RX,R,R,-PI/2,-PI/2+PHI);g.stroke();
const cc=['#c9d1d9','#1d4ed8','#ef4444','#111','#e5e7eb','#16a34a','#f59e0b','#7c3aed','#0ea5e9'];
for(let i=0;i<9;i++){const x=OX+i*4.9;g.fillStyle=cc[i];rr(x,.3,4.5,.8,.25);g.fill();rr(x+1,1,2.2,.5,.2);g.fill();circ(x+.9,.33,.33,'#111');circ(x+3.6,.33,.33,'#111')}
g.fillStyle='#f1f5f9';g.fillRect(OX+46,.9,13,3.2);g.fillStyle='#dc2626';g.fillRect(OX+59.3,.6,2.7,2.8);g.fillStyle='#bfe8ff';g.fillRect(OX+60.6,2.2,1.4,.9);
for(const wx of[OX+48,OX+50,OX+53,OX+60])circ(wx,.5,.5,'#111');
g.save();g.translate(S.x,S.y);g.rotate(S.a);
if(S.thr){const l=1.5+Math.random()*2;g.fillStyle='#ff9d2e';g.beginPath();g.moveTo(-2.1,.1);g.lineTo(-2.1-l,0);g.lineTo(-2.1,-.15);g.fill();g.fillStyle='#fff3a0';g.beginPath();g.moveTo(-2.1,.05);g.lineTo(-2.1-l*.5,0);g.lineTo(-2.1,-.1);g.fill()}
g.fillStyle='#d1001c';rr(-2.1,-.35,4.2,.6,.22);g.fill();g.fillStyle='#a80016';rr(-.6,.2,1.7,.42,.2);g.fill();g.fillStyle='#bfe8ff';rr(-.4,.25,1.3,.3,.12);g.fill();
for(const wx of[-1.3,1.3]){circ(wx,-.22,.33,'#111');circ(wx,-.22,.15,'#aaa')}g.restore();
g.setTransform(1,0,0,1,0,0);g.font='bold 12px sans-serif';g.fillStyle='rgba(255,255,255,.7)';g.textAlign='center';
for(let m=Math.ceil((cx-W/Z/2)/50)*50;m<cx+W/Z/2;m+=50)g.fillText(m+' m',W/2+(m-cx)*Z,H/2+cy*Z+Z*3);
hud()}
function T(s,x,y,sz,col,al){g.font='bold '+sz+'px sans-serif';g.fillStyle=col||'#fff';g.textAlign=al||'left';g.fillText(s,x,y)}
function hud(){
g.fillStyle='rgba(0,0,0,.45)';rr(10,10,230,150,10);g.fill();
T('Distance '+Math.round(S.x)+' m  (ramp at '+RX+' m)',22,34,14);T('Speed '+Math.round(S.sp*3.6)+' km/h',22,56,14);T('Flips '+S.flips,22,78,14);T('Air jumps '+S.jumps,22,100,14);
T('Air time '+S.air.toFixed(1)+'s (best '+S.best.toFixed(1)+'s)',22,122,14);T('Time '+S.time.toFixed(1)+'s',22,144,14);
const fw=Math.min(300,W-40),fx=(W-fw)/2,fy=H-40;
g.fillStyle='rgba(0,0,0,.5)';rr(fx-4,fy-4,fw+8,22,8);g.fill();
g.fillStyle=S.fuel>25?'#3ddc84':'#ff4d4d';rr(fx,fy,fw*S.fuel/100,14,6);g.fill();T('THRUSTER FUEL '+Math.round(S.fuel)+'%',W/2,fy-10,12,'#fff','center');
if(S.state=='lights'||(S.state=='race'&&S.time<1.2)){
const x=W/2,y=60;g.fillStyle='#14161c';rr(x-135,y-34,270,68,12);g.fill();
for(let i=0;i<5;i++){const on=S.state=='race'||i<S.lit;circ(x-96+i*48,y,19,on?'#ff1a1a':'#3a1010');if(on)circ(x-96+i*48,y,26,'rgba(255,60,60,.25)')}
if(S.state=='lights')T('Wait for all 5 lights... then hit SPACE or UP!',x,y+66,16,'#fff','center');else T('GO!',x,y+70,34,'#3ddc84','center')}
if(S.state=='race'&&S.react===null&&S.time>1.2)T('Hit SPACE / UP to launch!',W/2,60,20,'#ffd34d','center');
if(S.react!==null&&S.state=='race'&&S.time<5)T('Reaction time: '+S.react.toFixed(3)+' s'+(S.jump?'  (JUMP START!)':''),W/2,60,22,S.jump?'#ff6b6b':'#3ddc84','center');
if(S.state=='lights'&&S.jump)T('JUMP START!',W/2,160,26,'#ff6b6b','center');
if(S.state=='race'||S.state=='lights'){T('1) Jump the Teslas + semi (140 m) with SPACE   2) Build speed, climb the ramp, flip, land!',W/2,H-62,13,'rgba(255,255,255,.85)','center');
T('SPACE thruster (lifts off on ground) | LEFT/RIGHT rotate in air | UP gas | DOWN brake',W/2,H-80,12,'rgba(255,255,255,.6)','center')}
if(S.state=='done'||S.state=='crash'){
g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);const x=W/2,y=H/2-130;
T(S.state=='done'?'STUNT COMPLETE!':'CRASHED - '+S.why,x,y,34,S.state=='done'?'#3ddc84':'#ff6b6b','center');
const L=['Distance: '+Math.round(S.x)+' m','Time: '+S.time.toFixed(2)+' s','Reaction time: '+(S.react===null?'--':S.react.toFixed(3)+' s')+(S.jump?' (jump start)':''),'Flips: '+S.flips,'Times in the air: '+S.jumps,'Total air time: '+S.air.toFixed(1)+' s','Longest air time: '+S.best.toFixed(1)+' s','Top speed: '+Math.round(S.maxV*3.6)+' km/h','Fuel left: '+Math.round(S.fuel)+'%'];
L.forEach((s,i)=>T(s,x,y+44+i*28,18,'#fff','center'));T('Press SPACE or R to try again',x,y+44+L.length*28+16,16,'#ffd34d','center')}}
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;for(let i=0;i<4;i++)step(dt/4);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
